name: PR Review by OpenHands

on:
  workflow_call:
    inputs:
      runs-on:
        description: The type of machine to run the job on
        default: ubuntu-latest
        type: string
    secrets:
      OPENAI_KEY:
        required: true
      TALKABLE_BOT_GITHUB_ACCESS_TOKEN:
        required: true

jobs:
  pr-review:
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'talkable-bot' &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '/pr-review')
        )
      )

    runs-on: ${{ inputs.runs-on }}
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout software-agent-sdk repository
        uses: actions/checkout@v7
        with:
          repository: OpenHands/software-agent-sdk
          path: software-agent-sdk

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.TALKABLE_BOT_GITHUB_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # A title, body or branch name is attacker-controlled, and `${{ }}` pastes it into
          # the script verbatim — a backtick or $(...) in a PR body then runs on the runner,
          # which holds GH_TOKEN. Read them from the environment, where they stay data.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            PR_DATA=$(gh api "repos/$REPO/pulls/$ISSUE_NUMBER")
            PR_NUMBER=$ISSUE_NUMBER
            PR_TITLE=$(jq -r '.title' <<< "$PR_DATA")
            PR_BODY=$(jq -r '.body // ""' <<< "$PR_DATA")
            PR_HEAD_BRANCH=$(jq -r '.head.ref' <<< "$PR_DATA")
            PR_BASE_BRANCH=$(jq -r '.base.ref' <<< "$PR_DATA")
          fi

          # Random delimiter: with a fixed one, a body containing that line closes the
          # heredoc early and forges the outputs below it — pr_head_branch feeds the `ref`
          # of the checkout two steps down.
          delimiter=$(openssl rand -hex 16)
          {
            echo "pr_number=$PR_NUMBER"
            echo "pr_head_branch=$PR_HEAD_BRANCH"
            echo "pr_base_branch=$PR_BASE_BRANCH"
            echo "pr_title<<$delimiter"
            echo "$PR_TITLE"
            echo "$delimiter"
            echo "pr_body<<$delimiter"
            echo "$PR_BODY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: pr-repo
          ref: ${{ steps.pr-details.outputs.pr_head_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install OpenHands dependencies
        run: |
          # Install OpenHands SDK and tools from git repository
          uv pip install --system "openhands-sdk @ git+https://github.com/OpenHands/software-agent-sdk.git@main#subdirectory=openhands-sdk"
          uv pip install --system "openhands-tools @ git+https://github.com/OpenHands/software-agent-sdk.git@main#subdirectory=openhands-tools"

      - name: Run PR review
        env:
          GITHUB_TOKEN: ${{ secrets.TALKABLE_BOT_GITHUB_ACCESS_TOKEN }}
          LLM_API_KEY: ${{ secrets.OPENAI_KEY }}
          LLM_BASE_URL: https://api.openai.com/v1
          LLM_MODEL: gpt-5.6
          PR_BASE_BRANCH: ${{ steps.pr-details.outputs.pr_base_branch }}
          PR_BODY: ${{ steps.pr-details.outputs.pr_body }}
          PR_HEAD_BRANCH: ${{ steps.pr-details.outputs.pr_head_branch }}
          PR_NUMBER: ${{ steps.pr-details.outputs.pr_number }}
          PR_TITLE: ${{ steps.pr-details.outputs.pr_title }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Change to the PR repository directory so agent can analyze the code
          cd pr-repo

          # Run the PR review script from the agent-sdk checkout
          uv run python ../software-agent-sdk/examples/03_github_workflows/02_pr_review/agent_script.py
